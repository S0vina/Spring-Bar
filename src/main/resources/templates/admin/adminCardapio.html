<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gerenciamento de Cardápio (Admin)</title>
</head>
<body>
<h1>Gerenciamento de Cardápio</h1>

<h2>Itens Atuais</h2>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Preço</th>
        <th>Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="produto : ${produtos}">
        <td th:text="${produto.id}">1</td>
        <td th:text="${produto.nome}">Nome do Produto</td>
        <td th:text="${#numbers.formatCurrency(produto.preco)}">R$ 5,00</td>
        <td>
            <a th:href="@{/admin/cardapio/editar/{id}(id=${produto.id})}">Editar</a>
            |
            <a th:href="@{/admin/cardapio/excluir/{id}(id=${produto.id})}">Excluir</a>
        </td>
    </tr>
    </tbody>
</table>

<hr>

<h2>Cadastrar Novo Item / Editar</h2>

<form th:action="@{/admin/cardapio}" th:object="${produtoForm}" method="post">

    <input type="hidden" th:field="*{id}" />

    <div>
        <label for="nome">Nome do Item:</label>
        <input type="text" id="nome" th:field="*{nome}" required>
    </div>

    <div>
        <label for="preco">Preço (R$):</label>
        <input type="number" id="preco" th:field="*{preco}" step="0.01" required>
    </div>

    <div>
        <label for="categoria">Categoria:</label>
        <select id="categoria" th:field="*{categoria}" required>
            <option value="">-- Selecione uma Categoria --</option>
            <option th:each="cat : ${categorias}"
                    th:value="${cat}"
                    th:text="${cat}"></option>
        </select>
    </div>

    <button type="submit">Salvar Produto</button>
</form>
</body>
</html>
