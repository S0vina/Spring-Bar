spring.application.name=hillanBar

## Configurações do Banco de Dados MySQL

# 1. Driver
spring.datasource.url=jdbc:mysql://localhost:3306/nome_do_seu_banco?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC

# 2. User
spring.datasource.username=root

# 3. Senha
spring.datasource.password=Hi1986$#

# 4. Driver class
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

## Configurações do JPA e Hibernate

# 5. Dialeto (para o Spring Data JPA saber como falar com o MySQL)
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# 6. DDL Auto (Cria/Atualiza as tabelas automaticamente)
spring.jpa.hibernate.ddl-auto=update

# 7. Mostrar SQL (Opcional, útil para debug)
spring.jpa.show-sql=true
